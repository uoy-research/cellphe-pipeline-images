name: build_images

on:
  pull-request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'r-dplyr/**'

  workflow-dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push r-dplyr
        uses: docker/build-push-action@v6
        with:
          push: true
          context: r-dplyr
          tags: |
            ghcr.io/cellphe/r-dplyr:latest
            ghcr.io/cellphe/r-dplyr:0.1.0
