name: build_quarto

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - 'quarto-tidyverse-pandas/**'

env:
  SOURCE: "quarto-tidyverse-pandas"
  IMAGE: "cellphe-quarto"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set variables
        run: |
          VER=$(cat $SOURCE/version)
          echo "VERSION=$VER" >> $GITHUB_ENV
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push quarto
        uses: docker/build-push-action@v6
        with:
          push: true
          context: $SOURCE
          tags: |
            ghcr.io/${{ github.repository_owner }}/$IMAGE:latest
            ghcr.io/${{ github.repository_owner }}/$IMAGE:$VERSION
